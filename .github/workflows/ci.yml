name: ML Pipeline CI/CD

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      APP_ENV: ${{ secrets.APP_ENV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install pytest and flake8
        run: pip install pytest flake8

      - name: Download dataset
        run: |
          python -c "
          import ssl
          ssl._create_default_https_context = ssl._create_unverified_context
          from sklearn.datasets import fetch_california_housing
          import pandas as pd
          data = fetch_california_housing(as_frame=True)
          df = data.frame
          df.to_csv('data/housing.csv', index=False)
          print('Dataset ready')
          "

      - name: Check code quality
        run: flake8 src/ --max-line-length=100 --ignore=E501,W503,E302,E303,W291,W293,E501,F401

      - name: Run tests
        run: pytest tests/ -v

      - name: Check environment
        run: echo "Environment is set"

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t house-price-api:latest .

      - name: Verify Docker image
        run: docker images house-price-api
