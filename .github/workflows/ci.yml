name: ML Pipeline CI/CD

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    # Environment variables available to all steps
    # ${{ secrets.APP_ENV }} pulls from GitHub secrets
    # Never visible in logs — shows as ***
    env:
      APP_ENV: ${{ secrets.APP_ENV }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install pytest and flake8
        run: pip install pytest flake8

      - name: Download dataset
        run: |
          python -c "
          import ssl
          ssl._create_default_https_context = ssl._create_unverified_context
          from sklearn.datasets import fetch_california_housing
          import pandas as pd
          data = fetch_california_housing(as_frame=True)
          df = data.frame
          df.to_csv('data/housing.csv', index=False)
          print('Dataset ready')
          "

      # Code quality check
      # Checks code style before running tests
      # If code is messy → fail immediately
      - name: Check code quality
        run: flake8 src/ --max-line-length=100 --ignore=E501,W503

      - name: Run tests
        run: pytest tests/ -v

      # Print the environment to confirm secret loaded
      - name: Check environment
        run: |
          echo "Environment: $APP_ENV"

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t house-price-api:latest .

      - name: Verify Docker image
        run: docker images house-price-api
